name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      # Branch and PR builds: compile and package, but publish nothing.
      - name: Build installer and portable exe
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      # Tag builds: electron-builder creates the GitHub release and uploads the
      # installer together with latest.yml and the .blockmap. Both of those are
      # what electron-updater reads, so they must not be uploaded by hand.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skirin-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
