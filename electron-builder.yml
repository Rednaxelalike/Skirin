appId: com.skirin.app
productName: Skirin
copyright: Skirin

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true
compression: maximum

# Strips Chromium's unused locale bundles from the packaged runtime.
afterPack: scripts/after-pack.cjs

# electron-updater reads the copy of this that lands in resources/app-update.yml,
# so the app always looks for updates wherever the build actually published.
publish:
  provider: github
  owner: Rednaxelalike
  repo: Skirin
  releaseType: release

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Skirin
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # Delta downloads: electron-updater only pulls the changed blocks between
  # the installed build and the new one.
  differentialPackage: true

portable:
  artifactName: ${productName}-${version}-portable.${ext}
