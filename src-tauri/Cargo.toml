[package]
name = "skirin"
version = "2.3.0"
description = "Skirin — a beautiful, native-feeling screenshot studio for Windows"
authors = ["Skirin"]
license = "MIT"
repository = "https://github.com/Rednaxelalike/Skirin"
edition = "2021"
rust-version = "1.82"

[lib]
# The desktop entry point is a thin `main.rs`; everything testable lives here.
name = "skirin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Foundation",
  "Foundation_Numerics",
] }

[target.'cfg(windows)'.dependencies.tauri-plugin-updater]
version = "2.10.1"

[profile.release]
# Size is the whole point of this rewrite: LTO across every crate, one codegen
# unit so the linker can see all of it, and no unwinding tables.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
